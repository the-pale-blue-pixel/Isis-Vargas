<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Respuesta registrada</title>
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="favicon.ico?v=4" sizes="any">
  <style>
    :root {
      --ink: #181718;
      --muted: #67636a;
      --mono: "Courier New", Courier, monospace;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 45% 48%, rgba(247, 161, 207, .46), transparent 48%),
        radial-gradient(ellipse at 78% 62%, rgba(136, 170, 225, .3), transparent 50%),
        linear-gradient(180deg, #c4bfbd 0%, #d4d0d1 48%, #dde0e4 100%);
      font-family: var(--mono);
    }

    #sparkle-rain {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .confirmation {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      text-align: center;
    }

    .confirmation-content { transform: translateY(-2vh); }

    .bear {
      display: block;
      margin-bottom: 22px;
      font-size: clamp(28px, 5vw, 48px);
      line-height: 1;
      letter-spacing: .08em;
    }

    h1 {
      margin: 0;
      font-size: clamp(22px, 4vw, 38px);
      line-height: 1.2;
      letter-spacing: -.035em;
    }

    p {
      max-width: 560px;
      margin: 18px auto 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    @media (prefers-reduced-motion: reduce) {
      #sparkle-rain { display: none; }
    }
  </style>
</head>
<body>
  <canvas id="sparkle-rain" aria-hidden="true"></canvas>
  <main class="confirmation">
    <div class="confirmation-content">
      <span class="bear" aria-hidden="true">ʕ⁠っ⁠•⁠ᴥ⁠•⁠ʔ⁠っ ♡</span>
      <h1>Tu respuesta fue registrada.</h1>
      <p>Gracias. La información servirá para preparar las sesiones y los recursos del taller.</p>
    </div>
  </main>

  <script>
    const canvas = document.getElementById("sparkle-rain");
    const context = canvas.getContext("2d");
    const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
    let sparkles = [];

    function createSparkle(randomY = false) {
      const palette = [
        [255, 238, 249],
        [238, 244, 255],
        [247, 184, 221],
        [174, 201, 243]
      ];
      return {
        x: Math.random() * innerWidth,
        y: randomY ? Math.random() * innerHeight : -12 - Math.random() * innerHeight * .18,
        size: .7 + Math.random() * 1.7,
        speed: .12 + Math.random() * .28,
        drift: (Math.random() - .5) * .09,
        phase: Math.random() * Math.PI * 2,
        twinkle: .004 + Math.random() * .009,
        color: palette[Math.floor(Math.random() * palette.length)]
      };
    }

    function resize() {
      const ratio = Math.min(devicePixelRatio || 1, 1.5);
      canvas.width = Math.round(innerWidth * ratio);
      canvas.height = Math.round(innerHeight * ratio);
      context.setTransform(ratio, 0, 0, ratio, 0, 0);
      const amount = Math.max(42, Math.round((innerWidth * innerHeight) / 17000));
      sparkles = Array.from({ length: amount }, () => createSparkle(true));
    }

    function drawSparkle(sparkle, time) {
      const pulse = .28 + (Math.sin(time * sparkle.twinkle + sparkle.phase) + 1) * .25;
      const [red, green, blue] = sparkle.color;
      context.save();
      context.translate(sparkle.x, sparkle.y);
      context.fillStyle = `rgba(${red}, ${green}, ${blue}, ${pulse})`;
      context.shadowColor = `rgba(${red}, ${green}, ${blue}, .55)`;
      context.shadowBlur = 7;
      context.beginPath();
      context.moveTo(0, -sparkle.size * 2.7);
      context.quadraticCurveTo(sparkle.size * .3, -sparkle.size * .3, sparkle.size * 2.7, 0);
      context.quadraticCurveTo(sparkle.size * .3, sparkle.size * .3, 0, sparkle.size * 2.7);
      context.quadraticCurveTo(-sparkle.size * .3, sparkle.size * .3, -sparkle.size * 2.7, 0);
      context.quadraticCurveTo(-sparkle.size * .3, -sparkle.size * .3, 0, -sparkle.size * 2.7);
      context.fill();
      context.restore();
    }

    function animate(time) {
      context.clearRect(0, 0, innerWidth, innerHeight);
      sparkles.forEach((sparkle, index) => {
        sparkle.y += sparkle.speed;
        sparkle.x += sparkle.drift + Math.sin(time * .00025 + sparkle.phase) * .025;
        if (sparkle.y > innerHeight + 14 || sparkle.x < -14 || sparkle.x > innerWidth + 14) {
          sparkles[index] = createSparkle(false);
        } else {
          drawSparkle(sparkle, time);
        }
      });
      requestAnimationFrame(animate);
    }

    if (!reducedMotion) {
      addEventListener("resize", resize);
      resize();
      requestAnimationFrame(animate);
    }
  </script>
</body>
</html>
